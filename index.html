<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة بياناتك في فضاء الإنترنت</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&display=swap">
<style>
:root{--bg:#f3f5fb;--ink:#13193a;--muted:#56607f;--stage:#e3e8f7;--safe:#2a5bff;--threat:#e5483d;--line:#9aa6cf;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1226;--ink:#eaeefc;--muted:#9aa5cc;--stage:#172046;--safe:#6f95ff;--threat:#ff6b5f;--line:#4a5688;--card:#151c3b}}
:root[data-theme="dark"]{--bg:#0d1226;--ink:#eaeefc;--muted:#9aa5cc;--stage:#172046;--safe:#6f95ff;--threat:#ff6b5f;--line:#4a5688;--card:#151c3b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;line-height:1.8}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.45rem;line-height:1.4;margin:8px 0 4px;font-weight:600}
.sub{color:var(--muted);margin:0 0 6px;font-size:.95rem}
.by{margin:0 0 16px;font-weight:600;color:var(--safe);font-size:.95rem}
.stage{background:var(--stage);border-radius:18px;padding:6px}
svg{display:block;width:100%;height:auto}
svg text{font-family:inherit;text-anchor:middle;fill:var(--muted);font-size:10px}
.cap{margin:16px 2px 8px;min-height:150px}
.cap h2{font-size:1.15rem;margin:0 0 4px;font-weight:600}
.cap p{margin:0;color:var(--muted);max-width:60ch}
.cap ul{margin:8px 0 0;padding-inline-start:20px;color:var(--ink)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
button{font:inherit;border:0;border-radius:999px;padding:8px 18px;background:var(--safe);color:#fff;cursor:pointer;min-height:44px}
button.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.dots{display:flex;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--safe);width:24px;border-radius:6px}
</style>
</head>
<body>
<main>
<h1>رحلة بياناتك في فضاء الإنترنت</h1>
<p class="sub">ثمانية مشاهد تشرح كيف يشتغل الإنترنت، ومن يهدّده، وكيف نبني الدفاع ونتعامل مع الاختراق.</p>
<p class="by">إعداد: راما صالح آل بو زبدة</p>
<div class="stage"><svg id="svg" viewBox="0 0 360 240" role="img" aria-label="رسم متحرك يشرح الأمن السيبراني"><g id="scene"></g></svg></div>
<div class="cap" id="cap" aria-live="polite"></div>
<div class="bar">
<button class="alt" id="next" aria-label="المشهد التالي">التالي</button>
<div class="dots" id="dots"></div>
<button id="play" aria-label="إيقاف أو تشغيل">إيقاف</button>
</div>
<div class="bar" style="justify-content:center"><button class="alt" id="prev">السابق</button></div>
</main>
<script>
var T=function(x,y,s,f,w){return '<text x="'+x+'" y="'+y+'"'+(f?' style="font-size:'+f+'px"':'')+'>'+s+'</text>'};
function pk(path,dur,begin,fill,label,w,fade){
  w=w||18;
  return '<g><animateMotion path="'+path+'" dur="'+dur+'s" begin="'+begin+'s" repeatCount="indefinite"/>'+
  (fade?'<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.78;.84;1" dur="'+dur+'s" begin="'+begin+'s" repeatCount="indefinite"/>':'')+
  '<rect x="'+(-w/2)+'" y="-7" width="'+w+'" height="14" rx="4" fill="'+fill+'"/>'+
  (label?'<text y="3" style="fill:#fff;font-size:8px">'+label+'</text>':'')+'</g>';
}
var base=
'<line x1="300" y1="120" x2="60" y2="120" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 5"/>'+
'<rect x="284" y="90" width="32" height="60" rx="7" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><circle cx="300" cy="140" r="2.5" fill="var(--ink)"/>'+T(300,168,'جهازك')+
'<circle cx="180" cy="120" r="17" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><path d="M171 118a13 13 0 0 1 18 0M174 124a8 8 0 0 1 12 0" fill="none" stroke="var(--safe)" stroke-width="2" stroke-linecap="round"/>'+T(180,152,'الراوتر')+
'<g fill="var(--card)" stroke="var(--ink)" stroke-width="2"><rect x="42" y="94" width="36" height="14" rx="3"/><rect x="42" y="111" width="36" height="14" rx="3"/><rect x="42" y="128" width="36" height="14" rx="3"/></g>'+T(60,164,'خادم الموقع');
var hack=function(lbl){return '<line x1="180" y1="62" x2="180" y2="102" stroke="var(--threat)" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="180" cy="46" r="16" fill="var(--threat)"><animate attributeName="r" values="16;19;16" dur="1.6s" repeatCount="indefinite"/></circle><text x="180" y="51" style="font-size:15px;fill:#fff">👁</text>'+T(180,78,lbl,9)};
var S=[
{t:'ما هو فضاء الإنترنت؟',d:'شبكة ضخمة من الأجهزة المتصلة. لما تفتح موقعاً، تنقسم رسالتك إلى حزم صغيرة تمرّ عبر الراوتر إلى الخادم، ثم يرجع الرد بنفس الطريق.',
 s:base+pk('M300 120 L60 120',3,0,'var(--safe)','',18)+pk('M300 120 L60 120',3,1.5,'var(--safe)','',18)+pk('M60 120 L300 120',3,.75,'var(--safe)','',18)},
{t:'الخطر: بيانات مكشوفة',d:'إذا كانت الحزم غير محمية، فأي متنصّت على الطريق، مثل شبكة واي فاي عامة مفتوحة، يقدر يقرأ كلمات السر ورسائلك. وهذا هجوم الرجل في المنتصف (MITM): يعترض البيانات وقد يعدّلها قبل وصولها.',
 s:base+hack('متنصّت')+pk('M300 120 L60 120',3.4,0,'var(--threat)','pass:1234',46)+pk('M300 120 L60 120',3.4,1.7,'var(--threat)','pass:1234',46)},
{t:'من يهاجمك؟',d:'التصيّد: رسالة مزيفة تخدعك لتعطي بياناتك. الفيروسات تتسلل لجهازك. الفدية تشفّر ملفاتك وتطلب مالاً لفكّها. وهجمات DDoS تغرق موقعاً بطلبات حتى يتوقف.',
 s:base+pk('M40 40 L282 116',4,0,'var(--threat)','تصيّد',40)+pk('M40 200 L282 124',4,1,'var(--threat)','فيروس',40)+pk('M120 20 L290 98',4,2,'var(--threat)','فدية',40)+pk('M120 222 L290 144',4,3,'var(--threat)','DDoS',40)},
{t:'التشفير: قفل على كل حزمة',d:'في مصافحة TLS يتفق جهازك والخادم على مفتاح تشفير، ثم تُقفل كل حزمة قبل خروجها ولا يفتحها إلا الخادم. المتنصّت يرى رموزاً لا معنى لها، وأي تعديل عليها يُكتشف.',
 s:base+hack('متنصّت')+T(228,40,'؟؟؟ لا أفهم شيئاً',10)+pk('M300 120 L60 120',3.4,0,'var(--safe)','🔒x9#k',46)+pk('M300 120 L60 120',3.4,1.7,'var(--safe)','🔒q7!z',46)},
{t:'درعك الشخصي',d:'الحماية تبدأ بعادات بسيطة:<ul><li>كلمة سر قوية ومختلفة لكل حساب</li><li>التحقق بخطوتين</li><li>تحديث الجهاز والتطبيقات</li><li>لا تضغط على رابط مجهول</li></ul>',
 s:base+'<circle cx="300" cy="120" r="46" fill="none" stroke="var(--safe)" stroke-width="2.5" stroke-dasharray="10 6"><animateTransform attributeName="transform" type="rotate" from="0 300 120" to="360 300 120" dur="14s" repeatCount="indefinite"/></circle><circle cx="300" cy="120" r="60" fill="none" stroke="var(--safe)" stroke-width="1.5" stroke-dasharray="3 7" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="360 300 120" to="0 300 120" dur="20s" repeatCount="indefinite"/></circle>'+T(300,196,'🛡 محمي',11)+
 pk('M40 40 L250 112',3.4,0,'var(--threat)','تصيّد',40,1)+pk('M40 200 L250 126',3.4,1.1,'var(--threat)','فيروس',40,1)+pk('M120 20 L252 100',3.4,2.2,'var(--threat)','فدية',40,1)},
{t:'ثلاثية الأمن: CIA',d:'كل قرار أمني يخدم واحداً من ثلاثة أهداف:<ul><li>السرية: لا يطّلع على البيانات إلا المخوّل (تشفير وصلاحيات)</li><li>السلامة: لا تتغير دون علم (تجزئة Hash وتوقيع رقمي)</li><li>التوافر: الخدمة تعمل وقت الحاجة (نسخ احتياطي ومقاومة DDoS)</li></ul>',
 s:'<polygon points="180,52 90,185 270,185" fill="none" stroke="var(--line)" stroke-width="2"/>'+T(180,150,'CIA',26)+
 '<g style="fill:#fff"><circle cx="180" cy="52" r="22" fill="var(--safe)"><animate attributeName="r" values="22;25;22" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="90" cy="185" r="22" fill="var(--safe)"><animate attributeName="r" values="22;25;22" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle><circle cx="270" cy="185" r="22" fill="var(--safe)"><animate attributeName="r" values="22;25;22" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle></g>'+
 '<text x="180" y="56" style="fill:#fff;font-size:11px">السرية</text><text x="90" y="189" style="fill:#fff;font-size:11px">السلامة</text><text x="270" y="189" style="fill:#fff;font-size:11px">التوافر</text>'+
 T(180,20,'Confidentiality',9)+T(90,222,'Integrity',9)+T(270,222,'Availability',9)},
{t:'الدفاع بالطبقات',d:'لا نعتمد على خط دفاع واحد، فإذا سقطت طبقة تبقى التي بعدها (Defense in Depth):<ul><li>الشبكة: جدار ناري وكشف التسلل IDS</li><li>الأجهزة: ترقيع الثغرات وEDR</li><li>التطبيقات: أقل صلاحية ممكنة Least Privilege</li><li>البيانات: تشفير ونسخ احتياطي</li></ul>',
 s:'<g fill="none" stroke="var(--safe)" stroke-width="2"><circle cx="180" cy="120" r="98" opacity=".45"/><circle cx="180" cy="120" r="74" opacity=".65"/><circle cx="180" cy="120" r="50" opacity=".85"/></g><circle cx="180" cy="120" r="26" fill="var(--safe)"/><text x="180" y="123" style="fill:#fff;font-size:9px">البيانات</text>'+T(180,85,'الأجهزة',8)+T(180,61,'التطبيقات',8)+T(180,37,'الشبكة',8)+
 pk('M6 120 L82 120',3.6,0,'var(--threat)','هجوم',36,1)+pk('M354 120 L278 120',3.6,1.8,'var(--threat)','هجوم',36,1)},
{t:'عند الاختراق: الاستجابة للحوادث',d:'لا يوجد أمان مطلق، فالمهم سرعة الاكتشاف وجودة الاستجابة. المسار المتبع: كشف، احتواء، استئصال السبب، تعافي، ثم دروس تُحدّث السياسات. كل دقيقة تأخير تزيد حجم الضرر.',
 s:(function(){var x=[310,245,180,115,50],a=['الكشف','الاحتواء','الاستئصال','التعافي','الدروس'],b=['تنبيهات SIEM','عزل الجهاز','إزالة الثغرة','استعادة النسخ','تحديث السياسات'],o='<line x1="310" y1="110" x2="50" y2="110" stroke="var(--line)" stroke-width="3"/>';x.forEach(function(v,k){o+='<circle cx="'+v+'" cy="110" r="15" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text x="'+v+'" y="114" style="fill:var(--ink);font-size:11px">'+(k+1)+'</text><text x="'+v+'" y="144" style="fill:var(--ink);font-size:10px">'+a[k]+'</text><text x="'+v+'" y="160" style="font-size:7.5px">'+b[k]+'</text>'});return o+'<circle r="7" fill="var(--threat)"><animateMotion path="M310 110 L50 110" dur="8s" repeatCount="indefinite"/></circle>'})()}
];
var i=0,playing=!window.matchMedia('(prefers-reduced-motion: reduce)').matches,timer;
var sc=document.getElementById('scene'),cap=document.getElementById('cap'),dots=document.getElementById('dots'),pb=document.getElementById('play');
S.forEach(function(){dots.appendChild(document.createElement('i'))});
function show(n){
  i=(n+S.length)%S.length;
  sc.innerHTML=S[i].s;
  cap.innerHTML='<h2>'+S[i].t+'</h2><p>'+S[i].d+'</p>';
  [].forEach.call(dots.children,function(d,k){d.className=k===i?'on':''});
}
function tick(){clearInterval(timer);if(playing)timer=setInterval(function(){show(i+1)},8000);pb.textContent=playing?'إيقاف':'تشغيل'}
document.getElementById('next').onclick=function(){show(i+1);tick()};
document.getElementById('prev').onclick=function(){show(i-1);tick()};
pb.onclick=function(){playing=!playing;tick()};
show(0);tick();
</script>
</body>
</html>
